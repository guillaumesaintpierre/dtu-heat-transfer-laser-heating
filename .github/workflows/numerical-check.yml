name: Numerical reproduction check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce-report-values:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install -r verification/requirements.txt
      - name: Reproduce selected report temperatures
        run: python verification/check_report_numbers.py
